<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halo Controls</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:transparent;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.nav a{transition:color .15s ease,background-color .15s ease}
.nav a:hover{background:rgba(255,255,255,0.08);color:#F2F2F4}
.nav a:focus-visible,.btn:focus-visible,.tile:focus-visible{outline:2px solid #D8C28C;outline-offset:2px}
.btn{transition:transform .12s ease,filter .15s ease,background-color .15s ease}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(0.96)}
.tile{transition:transform .14s ease,background .18s ease}
.tile:hover{filter:brightness(1.08)}
.tile:active{transform:scale(0.97)}
</style>
</helmet>
<div style="width: 600px; height: 290px; box-sizing: border-box; border-radius: 26px; border: 1px solid rgba(255,255,255,0.10); background: linear-gradient(165deg, #1B1A20 0%, #141417 55%, #101012 100%); color: #F5F5F7; font-family: 'Onest', system-ui, sans-serif; position: relative; overflow: hidden; padding: 10px 16px 12px; display: flex; flex-direction: column">
  <span aria-hidden="true" style="position: absolute; right: -90px; top: -100px; width: 340px; height: 230px; background: radial-gradient(closest-side, rgba(217,159,179,0.10), rgba(217,159,179,0)); pointer-events: none"></span>
  <header style="height: 32px; display: flex; align-items: center; justify-content: space-between; position: relative">
    <div style="display: flex; align-items: center; gap: 8px">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600">Controls</h1>
      <span class="num" style="font-size: 13px; font-weight: 500; color: rgba(245,245,247,0.5)">Yoga Slim 7</span>
      <span style="display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 10px; background: rgba(217,159,179,0.12); color: #D99FB3; font-size: 11px; font-weight: 600">needs Halo helper</span>
    </div>
    <nav class="nav" aria-label="Halo sections" style="display: flex; align-items: center; gap: 0">
      <a href="Home2.dc.html" aria-label="Home" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #F2F2F4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg></a>
      <a href="Music.dc.html" aria-label="Music" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #C9B6F0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="17.5" cy="16" r="2.5"></circle></svg></a>
      <a href="Study3.dc.html" aria-label="Study" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #B59AE3"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6c-2-1.5-5-2-8-1.5V19c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V4.5C17 4 14 4.5 12 6z"></path><path d="M12 6v14.5"></path></svg></a>
      <a href="Pay3.dc.html" aria-label="Pay" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #91BDA0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2.5"></rect><path d="M3 10h18"></path></svg></a>
      <a href="Sixers2.dc.html" aria-label="Sixers" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #88B5E0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3v18M5.6 5.6c3 3 3 9.8 0 12.8M18.4 5.6c-3 3-3 9.8 0 12.8"></path></svg></a>
      <a href="Week.dc.html" aria-label="Week" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #D5D5DC"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></a>
      <span aria-hidden="true" style="width: 1px; height: 14px; margin: 0 4px; background: rgba(255,255,255,0.14)"></span>
      <a href="More.dc.html" aria-label="More tabs" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #B9B9C2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></a>
      <a href="Controls.dc.html" aria-label="Controls" aria-current="page" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.10); color: #F2F2F4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></a>
    </nav>
  </header>
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; min-height: 0; position: relative">
    <div style="flex-grow: 1; display: grid; grid-template-columns: 70px 70px minmax(0, 1fr); gap: 8px; min-height: 0">
      <div role="group" aria-label="Brightness 70 percent" style="position: relative; overflow: hidden; border-radius: 20px; background: rgba(255,255,255,0.07)">
        <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 70%; background: linear-gradient(180deg, #F1E6CC, #D8C28C)"></span>
        <span class="num" style="position: absolute; top: 9px; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 600">70%</span>
        <span style="position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3A3222" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>
      </div>
      <div role="group" aria-label="{{volLabel}}" style="position: relative; overflow: hidden; border-radius: 20px; background: rgba(255,255,255,0.07)">
        <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 45%; background: {{volFill}}"></span>
        <span class="num" style="position: absolute; top: 9px; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 600; color: {{volText}}">{{volValue}}</span>
        <span style="position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{volIcon}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{volPath}}"></path></svg></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
          <button type="button" class="tile" onClick="{{t.flip}}" aria-pressed="{{t.pressed}}" style="border: 0; border-radius: 18px; background: {{t.bg}}; color: #F2F2F4; font-family: inherit; text-align: left; padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; min-width: 0">
            <span style="width: 26px; height: 26px; border-radius: 13px; background: {{t.dot}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{t.iconCol}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg></span>
            <span style="min-width: 0"><span style="display: block; font-size: 13px; font-weight: 600; white-space: nowrap">{{t.name}}</span><span style="display: block; font-size: 11px; font-weight: 500; color: {{t.subCol}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.sub}}</span></span>
          </button>
        </sc-for>
      </div>
    </div>
    <div role="radiogroup" aria-label="Power mode" style="height: 36px; flex-shrink: 0; border-radius: 18px; background: rgba(255,255,255,0.06); padding: 3px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
        <button type="button" class="btn" role="radio" aria-checked="{{m.checked}}" onClick="{{m.pick}}" style="border: 0; border-radius: 15px; background: {{m.bg}}; color: {{m.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{m.name}}</button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":290}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: { wifi: true, bt: true, night: true, focus: false, mute: true }, mode: 1 }; }
  renderVals() {
    const fam = {
      sky: ['136,181,224', '#588CC5', 'linear-gradient(160deg, #24364C, #1C2A3B)'],
      amber: ['211,155,101', '#B97843', 'linear-gradient(160deg, #3C2C1E, #2E2117)'],
      lav: ['181,154,227', '#9174C9', 'linear-gradient(160deg, #33284C, #282039)'],
      rose: ['217,159,179', '#C47791', 'linear-gradient(160deg, #3D2833, #34232C)'],
      sage: ['145,189,160', '#639D83', 'linear-gradient(160deg, #253E33, #1D3029)']
    };
    const defs = [
      { k: 'wifi', name: 'Wi-Fi', f: 'sky', onSub: 'Connected', offSub: 'Off', icon: 'M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M2 9a14.5 14.5 0 0 1 20 0M12 19.5h.01' },
      { k: 'bt', name: 'Bluetooth', f: 'sky', onSub: 'WH-CH720N', offSub: 'Off', icon: 'm7 7 10 10-5 5V2l5 5L7 17' },
      { k: 'night', name: 'Night light', f: 'amber', onSub: 'On', offSub: 'Off', icon: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z' },
      { k: 'focus', name: 'Focus', f: 'lav', onSub: 'On', offSub: 'Off', icon: 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0' },
      { k: 'mute', name: 'Mute', f: 'rose', onSub: 'Muted', offSub: 'Sound on', icon: 'M4 9h3l5-4v14l-5-4H4zM16 9l5 6M21 9l-5 6' },
      { k: 'bat', name: '74%', f: 'sage', onSub: '1 h 37 min left', offSub: '', icon: 'M3 8h15v8H3zM21 11v2' }
    ];
    const tiles = defs.map((d) => {
      const isBat = d.k === 'bat';
      const on = isBat ? true : this.state.on[d.k];
      const F = fam[d.f];
      return {
        name: d.name, icon: d.icon, sub: on ? d.onSub : d.offSub,
        pressed: isBat ? 'false' : (on ? 'true' : 'false'),
        bg: on ? F[2] : 'rgba(255,255,255,0.06)',
        dot: on ? F[1] : 'rgba(255,255,255,0.09)',
        iconCol: on ? '#F7F3EE' : '#A9A9B1',
        subCol: on ? 'rgba(' + F[0] + ',0.95)' : 'rgba(235,235,245,0.55)',
        flip: () => { if (isBat) return; const n = Object.assign({}, this.state.on); n[d.k] = !n[d.k]; this.setState({ on: n }); }
      };
    });
    const modes = ['Battery', 'Balanced', 'Performance'].map((n, i) => ({
      name: n, checked: this.state.mode === i ? 'true' : 'false',
      bg: this.state.mode === i ? '#EDEBE6' : 'rgba(0,0,0,0)',
      fg: this.state.mode === i ? '#141416' : 'rgba(235,235,245,0.6)',
      pick: () => this.setState({ mode: i })
    }));
    const muted = this.state.on.mute;
    return {
      tiles, modes,
      volValue: muted ? 'Muted' : '45%',
      volLabel: muted ? 'Volume muted' : 'Volume 45 percent',
      volFill: muted ? 'rgba(217,159,179,0.20)' : 'linear-gradient(180deg, #EBC3D1, #C47791)',
      volText: muted ? '#D99FB3' : '#F2F2F4',
      volIcon: muted ? '#D99FB3' : '#3A2230',
      volPath: muted ? 'M4 9h3l5-4v14l-5-4H4zM16 9l5 6M21 9l-5 6' : 'M4 9h3l5-4v14l-5-4H4zM16 9a4 4 0 0 1 0 6'
    };
  }
}
</script>
</body>
</html>

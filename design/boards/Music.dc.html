<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halo Music</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:transparent;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.nav a{transition:color .15s ease,background-color .15s ease}
.nav a:hover{background:rgba(255,255,255,0.08);color:#F2F2F4}
.nav a:focus-visible,.btn:focus-visible,.tile:focus-visible{outline:2px solid #D8C28C;outline-offset:2px}
.btn{transition:transform .12s ease,filter .15s ease,background-color .15s ease}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(0.96)}
.tile{transition:transform .14s ease,background .18s ease}
.tile:hover{filter:brightness(1.08)}
.tile:active{transform:scale(0.97)}
</style>
</helmet>
<div style="width: 600px; height: 290px; box-sizing: border-box; border-radius: 26px; border: 1px solid rgba(201,182,240,0.22); background: #0E0D14; color: #F2F2F4; font-family: 'Onest', system-ui, sans-serif; position: relative; overflow: hidden; padding: 10px 18px 16px; display: flex; flex-direction: column">
  <span aria-hidden="true" style="position: absolute; inset: -40px; background: radial-gradient(60% 80% at 15% 30%, rgba(108,84,190,0.75), rgba(108,84,190,0) 70%), radial-gradient(55% 75% at 70% 20%, rgba(52,98,170,0.6), rgba(52,98,170,0) 70%), radial-gradient(60% 70% at 85% 90%, rgba(150,70,140,0.45), rgba(150,70,140,0) 70%), #14121E; filter: blur(18px)"></span>
  <span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,8,14,0.35), rgba(8,8,14,0.62))"></span>
  <header style="height: 32px; display: flex; align-items: center; justify-content: space-between; position: relative">
    <div style="display: flex; align-items: center; gap: 8px">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600">Music</h1>
      <span class="num" style="font-size: 13px; font-weight: 500; color: rgba(245,245,247,0.5)">Spotify</span>
    </div>
    <nav class="nav" aria-label="Halo sections" style="display: flex; align-items: center; gap: 0">
      <a href="Home2.dc.html" aria-label="Home" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #F2F2F4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg></a>
      <a href="Music.dc.html" aria-label="Music" aria-current="page" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.10); color: #F2F2F4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="17.5" cy="16" r="2.5"></circle></svg></a>
      <a href="Study3.dc.html" aria-label="Study" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #B59AE3"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6c-2-1.5-5-2-8-1.5V19c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V4.5C17 4 14 4.5 12 6z"></path><path d="M12 6v14.5"></path></svg></a>
      <a href="Pay3.dc.html" aria-label="Pay" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #91BDA0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2.5"></rect><path d="M3 10h18"></path></svg></a>
      <a href="Sixers2.dc.html" aria-label="Sixers" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #88B5E0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3v18M5.6 5.6c3 3 3 9.8 0 12.8M18.4 5.6c-3 3-3 9.8 0 12.8"></path></svg></a>
      <a href="Week.dc.html" aria-label="Week" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #D5D5DC"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></a>
      <span aria-hidden="true" style="width: 1px; height: 14px; margin: 0 4px; background: rgba(255,255,255,0.14)"></span>
      <a href="More.dc.html" aria-label="More tabs" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #B9B9C2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></a>
      <a href="Controls.dc.html" aria-label="Controls" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #D99FB3"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></a>
    </nav>
  </header>
  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; position: relative">
    <div style="display: flex; align-items: center; gap: 16px">
      <div style="position: relative; width: 96px; height: 96px; flex-shrink: 0">
        <div role="img" aria-label="Album art" style="width: 96px; height: 96px; border-radius: 20px; background: radial-gradient(70% 70% at 30% 30%, #7F68D6, rgba(127,104,214,0) 70%), radial-gradient(70% 70% at 80% 75%, #3C6FB8, rgba(60,111,184,0) 70%), #1C1830; box-shadow: 0 8px 24px rgba(0,0,0,0.35)"></div>
        <span style="position: absolute; right: -6px; bottom: -6px; width: 26px; height: 26px; border-radius: 13px; background: #121212; border: 2px solid #0E0D14; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7FD49A" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 9.5c4-1.3 8.5-1 12 1M7 13c3.3-1 6.8-.7 9.6.8M8 16.3c2.5-.7 5-.5 7.2.6"></path></svg></span>
      </div>
      <div style="flex-grow: 1; min-width: 0; -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent)">
        <div style="font-size: 21px; font-weight: 600; white-space: nowrap">[Song title]</div>
        <div style="font-size: 15px; font-weight: 500; color: rgba(242,242,244,0.62); margin-top: 2px">[Artist]</div>
      </div>
      <div style="display: flex; align-items: center; gap: 4px">
        <button type="button" class="btn" aria-label="Previous track" style="width: 44px; height: 44px; border: 0; background: transparent; color: #F2F2F4; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11 6v12L3 12zM20 6v12l-8-6z"></path></svg></button>
        <button type="button" class="btn" aria-label="{{playLabel}}" onClick="{{toggle}}" style="width: 48px; height: 48px; border: 0; background: transparent; color: #F2F2F4; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5.5" y="4" width="4.5" height="16" rx="1.4"></rect><rect x="14" y="4" width="4.5" height="16" rx="1.4"></rect></svg></sc-if>
          <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"></path></svg></sc-if>
        </button>
        <button type="button" class="btn" aria-label="Next track" style="width: 44px; height: 44px; border: 0; background: transparent; color: #F2F2F4; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 6v12l8-6zM13 6v12l8-6z"></path></svg></button>
      </div>
    </div>
    <div>
      <div role="progressbar" aria-label="Track position" aria-valuemin="0" aria-valuemax="{{dur}}" aria-valuenow="{{pos}}" style="position: relative; height: 16px">
        <svg width="564" height="16" viewBox="0 0 564 16" aria-hidden="true" style="position: absolute; inset: 0">
          <line x1="{{px}}" y1="8" x2="564" y2="8" stroke="rgba(242,242,244,0.22)" stroke-width="3" stroke-linecap="round"></line>
          <path d="{{wave}}" fill="none" stroke="#C9B6F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span style="position: absolute; top: 2px; left: {{knob}}; width: 4px; height: 12px; border-radius: 2px; background: #F2F2F4"></span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px">
        <span class="num" style="font-size: 13px; font-weight: 600; color: rgba(242,242,244,0.62); width: 48px">{{elapsed}}</span>
        <div style="display: flex; align-items: center; gap: 8px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(242,242,244,0.62)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h3l5-4v14l-5-4H4zM16 9a4 4 0 0 1 0 6"></path></svg>
          <span role="img" aria-label="Volume 60 percent" style="position: relative; width: 120px; height: 4px; border-radius: 2px; background: rgba(242,242,244,0.22)"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 60%; border-radius: 2px; background: #F2F2F4"></span></span>
        </div>
        <span class="num" style="font-size: 13px; font-weight: 600; color: rgba(242,242,244,0.62); width: 48px; text-align: right">{{remaining}}</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":290}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { playing: true, pos: 63 }; this.timer = null; }
  componentDidMount() { this.timer = setInterval(() => { if (this.state.playing) this.setState({ pos: this.state.pos >= 106 ? 0 : this.state.pos + 1 }); }, 1000); }
  componentWillUnmount() { if (this.timer) clearInterval(this.timer); }
  renderVals() {
    const dur = 106, pos = this.state.pos, playing = this.state.playing;
    const fmt = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    const px = Math.round((pos / dur) * 564);
    let d = 'M0 8';
    for (let x = 3; x <= px; x += 3) { const y = playing ? 8 + Math.sin(x / 8) * 4 : 8; d += ' L' + x + ' ' + y.toFixed(1); }
    return {
      playing, paused: !playing, playLabel: playing ? 'Pause' : 'Play',
      pos: String(pos), dur: String(dur), px: String(px), knob: Math.max(0, px - 2) + 'px',
      wave: d, elapsed: fmt(pos), remaining: '-' + fmt(dur - pos),
      toggle: () => this.setState({ playing: !this.state.playing })
    };
  }
}
</script>
</body>
</html>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":290}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: false }; }
  renderVals() {
    const on = this.state.on;
    return { on: on ? 'true' : 'false', sub: on ? 'On until 7 am' : 'Dims Halo, mutes alerts',
      track: on ? '#9C93E0' : 'rgba(255,255,255,0.16)', side: on ? 'flex-end' : 'flex-start',
      rowBg: on ? 'rgba(171,163,234,0.16)' : 'rgba(255,255,255,0.04)', edge: on ? 'rgba(171,163,234,0.5)' : 'rgba(255,255,255,0.08)',
      toggle: () => this.setState({ on: !this.state.on }) };
  }
}
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halo Sixers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:transparent;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.nav a{transition:color .15s ease,background-color .15s ease}
.nav a:hover{background:rgba(255,255,255,0.08);color:#F2F2F4}
.nav a:focus-visible,.btn:focus-visible,.tile:focus-visible{outline:2px solid #D8C28C;outline-offset:2px}
.btn{transition:transform .12s ease,filter .15s ease,background-color .15s ease}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(0.96)}
.tile{transition:transform .14s ease,background .18s ease}
.tile:hover{filter:brightness(1.08)}
.tile:active{transform:scale(0.97)}
</style>
</helmet>
<div style="width: 600px; height: 290px; box-sizing: border-box; border-radius: 26px; border: 1px solid rgba(136,181,224,0.18); background: linear-gradient(165deg, #1D2C3F 0%, #151E2A 55%, #10151C 100%); color: #F5F5F7; font-family: 'Onest', system-ui, sans-serif; position: relative; overflow: hidden; padding: 10px 16px 12px; display: flex; flex-direction: column">
  <span aria-hidden="true" style="position: absolute; left: -80px; top: -90px; width: 320px; height: 220px; background: radial-gradient(closest-side, rgba(136,181,224,0.18), rgba(136,181,224,0)); pointer-events: none"></span>
  <header style="height: 32px; display: flex; align-items: center; justify-content: space-between; position: relative">
    <div style="display: flex; align-items: center; gap: 8px">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600">Sixers</h1>
      <span class="num" style="font-size: 13px; font-weight: 500; color: rgba(245,245,247,0.5)">Thu 19 Nov</span>
    </div>
    <nav class="nav" aria-label="Halo sections" style="display: flex; align-items: center; gap: 0">
      <a href="Home2.dc.html" aria-label="Home" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #F2F2F4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg></a>
      <a href="Music.dc.html" aria-label="Music" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #C9B6F0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="17.5" cy="16" r="2.5"></circle></svg></a>
      <a href="Study3.dc.html" aria-label="Study" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #B59AE3"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6c-2-1.5-5-2-8-1.5V19c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V4.5C17 4 14 4.5 12 6z"></path><path d="M12 6v14.5"></path></svg></a>
      <a href="Pay3.dc.html" aria-label="Pay" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #91BDA0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2.5"></rect><path d="M3 10h18"></path></svg></a>
      <a href="Sixers2.dc.html" aria-label="Sixers" aria-current="page" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.10); color: #F2F2F4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3v18M5.6 5.6c3 3 3 9.8 0 12.8M18.4 5.6c-3 3-3 9.8 0 12.8"></path></svg></a>
      <a href="Week.dc.html" aria-label="Week" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #D5D5DC"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></a>
      <span aria-hidden="true" style="width: 1px; height: 14px; margin: 0 4px; background: rgba(255,255,255,0.14)"></span>
      <a href="More.dc.html" aria-label="More tabs" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #B9B9C2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></a>
      <a href="Controls.dc.html" aria-label="Controls" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #D99FB3"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></a>
    </nav>
  </header>
  <div style="flex-grow: 1; display: grid; grid-template-columns: minmax(0, 1fr) 1px 200px; gap: 18px; margin-top: 8px; min-height: 0; position: relative">
    <section aria-label="Next game" style="display: flex; flex-direction: column; min-width: 0">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #88B5E0">Next game</h2>
        <span style="font-size: 11px; color: rgba(159,178,200,0.7)">at Orlando</span>
      </div>
      <div style="margin-top: 8px; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 10px; height: 32px"><span style="width: 14px; height: 14px; border-radius: 4px; background: linear-gradient(135deg, #2A63C9 50%, #D8344F 50%)"></span><span style="font-size: 21px; font-weight: 600; width: 48px">PHI</span><span style="font-size: 13px; color: #9FB2C8">76ers</span><span style="margin-left: auto; font-size: 11px; color: rgba(159,178,200,0.7)">Away</span></div>
        <div style="height: 1px; background: rgba(136,181,224,0.12)"></div>
        <div style="display: flex; align-items: center; gap: 10px; height: 32px"><span style="width: 14px; height: 14px; border-radius: 4px; background: linear-gradient(135deg, #1F7CC2 50%, #C4CED4 50%)"></span><span style="font-size: 21px; font-weight: 600; width: 48px">ORL</span><span style="font-size: 13px; color: #9FB2C8">Magic</span><span style="margin-left: auto; font-size: 11px; color: rgba(159,178,200,0.7)">Home</span></div>
      </div>
      <div style="margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between">
        <div><div style="font-size: 11px; color: rgba(159,178,200,0.7)">Tip off</div><div class="num" style="font-size: 15px; font-weight: 600">8:00 am</div></div>
        <div style="text-align: right"><div style="font-size: 11px; color: rgba(159,178,200,0.7)">Starts in</div><div class="num" style="font-size: 28px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.05; color: #A9CBEC">9h 46m</div></div>
      </div>
      <div class="num" style="margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(136,181,224,0.12); font-size: 11px; color: rgba(159,178,200,0.7)">Maxey 0 pts, 0 reb, 0 ast. Live once it tips off.</div>
    </section>
    <span aria-hidden="true" style="background: rgba(136,181,224,0.14)"></span>
    <section aria-label="Alerts" style="display: flex; flex-direction: column">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600">Alerts</h2>
      <div style="margin-top: 6px; display: flex; flex-direction: column">
        <sc-for list="{{alerts}}" as="a" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; justify-content: space-between; height: 34px">
            <span style="font-size: 13px; font-weight: 500; color: {{a.fg}}">{{a.title}}</span>
            <button type="button" class="btn" role="switch" aria-checked="{{a.checked}}" aria-label="{{a.title}}" onClick="{{a.flip}}" style="width: 36px; height: 22px; border-radius: 11px; border: 0; padding: 2px; background: {{a.bg}}; display: flex; justify-content: {{a.side}}; cursor: pointer"><span style="width: 18px; height: 18px; border-radius: 9px; background: #F2F2F4"></span></button>
          </div>
        </sc-for>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":290}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: [true, true, true, true] }; }
  renderVals() {
    const names = ['Tip off reminder', 'Close game', 'Final score', 'Celebrate wins'];
    return { alerts: names.map((n, i) => { const on = this.state.on[i]; return {
      title: n, checked: on ? 'true' : 'false', fg: on ? '#F2F2F4' : 'rgba(235,235,245,0.55)',
      bg: on ? '#588CC5' : 'rgba(255,255,255,0.16)', side: on ? 'flex-end' : 'flex-start',
      flip: () => { const n2 = this.state.on.slice(); n2[i] = !n2[i]; this.setState({ on: n2 }); } }; }) };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halo Study</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:inherit;text-decoration:none}
a:hover{color:#fff}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 684px; height: 453px; box-sizing: border-box; padding: 18px 24px 20px; background: #000; color: #fff; font-family: 'Onest', system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px">
  <div aria-hidden="true" style="position: absolute; left: -40px; top: 60px; width: 360px; height: 360px; background: {{glow}}; pointer-events: none"></div>

  <nav aria-label="Halo tabs" style="display: flex; align-items: center; gap: 6px; height: 40px; position: relative">
    <a href="Main.dc.html" aria-label="Now" style="width: 44px; height: 40px; display: flex; align-items: center; justify-content: center; color: rgba(235,235,245,0.6)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"></path></svg>
    </a>
    <a href="#" aria-label="Music" style="width: 44px; height: 40px; display: flex; align-items: center; justify-content: center; color: rgba(235,235,245,0.6)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="17.5" cy="16" r="2.5"></circle></svg>
    </a>
    <a href="Study.dc.html" aria-label="Study" style="width: 44px; height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #fff">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6c-2-1.5-5-2-8-1.5V19c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V4.5C17 4 14 4.5 12 6z"></path><path d="M12 6v14.5" stroke="#000"></path></svg>
      <span style="width: 4px; height: 4px; border-radius: 2px; background: #fff"></span>
    </a>
    <a href="Pay.dc.html" aria-label="Pay" style="width: 44px; height: 40px; display: flex; align-items: center; justify-content: center; color: rgba(235,235,245,0.6)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2.5"></rect><path d="M3 10h18"></path><path d="M15.5 15h2.5"></path></svg>
    </a>
    <a href="Sixers.dc.html" aria-label="Sixers" style="width: 44px; height: 40px; display: flex; align-items: center; justify-content: center; color: rgba(235,235,245,0.6)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3v18M5.6 5.6c3 3 3 9.8 0 12.8M18.4 5.6c-3 3-3 9.8 0 12.8"></path></svg>
    </a>
  </nav>

  <div style="display: flex; gap: 24px; flex-grow: 1; position: relative">
    <section aria-label="Focus timer" style="width: 220px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <div role="img" aria-label="{{ringLabel}}" style="width: 196px; height: 196px; position: relative">
        <svg width="196" height="196" viewBox="0 0 196 196" aria-hidden="true" style="position: absolute; inset: 0; transform: rotate(-90deg)">
          <circle cx="98" cy="98" r="86" fill="none" stroke="{{track}}" stroke-width="10"></circle>
          <circle cx="98" cy="98" r="86" fill="none" stroke="{{colour}}" stroke-width="10" stroke-linecap="round" stroke-dasharray="{{dash}}"></circle>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
          <div class="num" style="font-size: 48px; font-weight: 700; letter-spacing: -0.02em; line-height: 1">{{time}}</div>
          <div style="font-size: 13px; font-weight: 700; color: {{soft}}">{{name}}</div>
        </div>
      </div>
      <div style="display: flex; gap: 8px">
        <button type="button" onClick="{{toggle}}" style="height: 44px; padding: 0 22px; border: 0; border-radius: 22px; background: #fff; color: #000; font-family: inherit; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; cursor: pointer">
          <sc-if value="{{running}}" hint-placeholder-val="{{ false }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#000" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"></rect><rect x="14" y="4" width="5" height="16" rx="1.5"></rect></svg>
          </sc-if>
          <sc-if value="{{stopped}}" hint-placeholder-val="{{ true }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#000" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"></path></svg>
          </sc-if>
          {{buttonLabel}}
        </button>
        <button type="button" aria-label="Reset timer" onClick="{{reset}}" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(255,255,255,0.16); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
        </button>
      </div>
    </section>

    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0">
      <div role="group" aria-label="Subject" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{subjects}}" as="s" hint-placeholder-count="6">
          <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="height: 36px; border: 0; border-radius: 18px; padding: 0 12px; font-family: inherit; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer; background: {{s.bg}}; color: {{s.fg}}">
            <span style="width: 7px; height: 7px; border-radius: 4px; flex-shrink: 0; background: {{s.dot}}"></span>{{s.short}}
          </button>
        </sc-for>
      </div>
      <section aria-label="This week" style="background: rgba(255,255,255,0.08); border-radius: 22px; padding: 14px 18px; display: flex; flex-direction: column; gap: 9px; flex-grow: 1">
        <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: rgba(235,235,245,0.6)"><span>THIS WEEK</span><span class="num">0 MIN</span></div>
        <sc-for list="{{subjects}}" as="s" hint-placeholder-count="6">
          <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 600">
            <span style="width: 78px; color: rgba(235,235,245,0.6)">{{s.short}}</span>
            <span style="flex-grow: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.16)"></span>
            <span class="num" style="width: 28px; text-align: right">0m</span>
          </div>
        </sc-for>
      </section>
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 18px; background: rgba(191,90,242,0.16); font-size: 13px; font-weight: 600">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D9A6F7" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.5"></path></svg>
        <span><span style="color: #D9A6F7; font-weight: 700">Chemistry is furthest behind.</span> Test Monday, 5 days to go.</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":684,"height":453}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'chem', running: false, left: 1500 };
    this.timer = null;
  }
  componentWillUnmount() { if (this.timer) clearInterval(this.timer); }
  renderVals() {
    const all = [
      { id: 'hb', short: 'Human Bio', name: 'Human Biology', c: '#FF6482', rgb: '255,100,130', soft: '#FF9DB0' },
      { id: 'chem', short: 'Chemistry', name: 'Chemistry', c: '#BF5AF2', rgb: '191,90,242', soft: '#D9A6F7' },
      { id: 'meth', short: 'Methods', name: 'Methods', c: '#0A84FF', rgb: '10,132,255', soft: '#7FB0FF' },
      { id: 'spec', short: 'Specialist', name: 'Specialist', c: '#64D2FF', rgb: '100,210,255', soft: '#9FE3FF' },
      { id: 'eng', short: 'English', name: 'English', c: '#FFD60A', rgb: '255,214,10', soft: '#FFE466' },
      { id: 'rel', short: 'Religion', name: 'Religion and Life', c: '#AC8E68', rgb: '172,142,104', soft: '#CDB494' }
    ];
    const cur = all.find((s) => s.id === this.state.picked) || all[1];
    const left = this.state.left;
    const mm = String(Math.floor(left / 60)).padStart(2, '0');
    const ss = String(left % 60).padStart(2, '0');
    const circ = 540.4;
    const len = Math.max(0.001, (left / 1500) * circ);
    const subjects = all.map((s) => ({
      short: s.short,
      dot: s.id === cur.id ? '#000' : s.c,
      bg: s.id === cur.id ? s.c : 'rgba(' + s.rgb + ',0.16)',
      fg: s.id === cur.id ? '#000' : s.soft,
      pressed: s.id === cur.id ? 'true' : 'false',
      pick: () => this.setState({ picked: s.id })
    }));
    return {
      subjects,
      colour: cur.c,
      soft: cur.soft,
      name: cur.name,
      track: 'rgba(' + cur.rgb + ',0.18)',
      glow: 'radial-gradient(closest-side, rgba(' + cur.rgb + ',0.22), rgba(' + cur.rgb + ',0.06) 55%, rgba(' + cur.rgb + ',0) 100%)',
      dash: len + ' ' + circ,
      time: mm + ':' + ss,
      ringLabel: mm + ' minutes ' + ss + ' seconds left, ' + cur.name,
      running: this.state.running,
      stopped: !this.state.running,
      buttonLabel: this.state.running ? 'Pause' : (left < 1500 ? 'Resume' : 'Start'),
      toggle: () => {
        if (this.state.running) {
          clearInterval(this.timer); this.timer = null;
          this.setState({ running: false });
        } else {
          this.timer = setInterval(() => {
            const n = Math.max(0, this.state.left - 1);
            this.setState({ left: n });
            if (n === 0) { clearInterval(this.timer); this.timer = null; this.setState({ running: false }); }
          }, 1000);
          this.setState({ running: true });
        }
      },
      reset: () => {
        if (this.timer) { clearInterval(this.timer); this.timer = null; }
        this.setState({ running: false, left: 1500 });
      }
    };
  }
}
</script>
</body>
</html>

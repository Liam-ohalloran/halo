<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halo Study</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.card{position:relative;overflow:hidden;border:1px solid var(--edge);transition:border-color .18s ease}
.card:hover{border-color:var(--edge-hi)}
.glow{position:absolute;pointer-events:none}
.nav a{transition:color .15s ease,background-color .15s ease}
.nav a:hover{background:rgba(255,255,255,0.07);color:#F2F2F4}
.nav a:focus-visible,.btn:focus-visible,.tile:focus-visible{outline:2px solid #D8C28C;outline-offset:2px}
.btn{transition:transform .12s ease,filter .15s ease,background-color .15s ease}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(0.96)}
.tile{transition:transform .14s ease,background-color .18s ease,border-color .18s ease}
.tile:active{transform:scale(0.97)}
</style>
</helmet>
<div style="width: 684px; height: 453px; box-sizing: border-box; padding: 0 12px 12px; background: #0B0B0D; color: #F2F2F4; font-family: 'Onest', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 2px 0 4px">
    <div style="display: flex; align-items: center; gap: 10px">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600">Study</h1>
      <span class="num" style="font-size: 13px; font-weight: 500; color: #8E8E97">Week of 16 Nov</span>
    </div>
    <nav class="nav" aria-label="Halo sections" style="display: flex; align-items: center; gap: 2px">
      <a href="HomeC.dc.html" aria-label="Home" style="width: 36px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #F2F2F4"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg></a>
      <a href="Study2.dc.html" aria-label="Study" aria-current="page" style="width: 36px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.08); color: #F2F2F4"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6c-2-1.5-5-2-8-1.5V19c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V4.5C17 4 14 4.5 12 6z"></path><path d="M12 6v14.5"></path></svg></a>
      <a href="Pay2.dc.html" aria-label="Pay" style="width: 36px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #91BDA0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2.5"></rect><path d="M3 10h18"></path></svg></a>
      <a href="Sixers2.dc.html" aria-label="Sixers" style="width: 36px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #88B5E0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3v18M5.6 5.6c3 3 3 9.8 0 12.8M18.4 5.6c-3 3-3 9.8 0 12.8"></path></svg></a>
      <span aria-hidden="true" style="width: 1px; height: 16px; margin: 0 4px; background: rgba(255,255,255,0.12)"></span>
      <a href="Controls.dc.html" aria-label="Controls" style="width: 36px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #D99FB3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></a>
    </nav>
  </header>
  <div style="flex-grow: 1; display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 12px; min-height: 0">
    <div style="display: flex; flex-direction: column; gap: 12px; min-height: 0">
      <section class="card" aria-label="Focus session" style="--edge: {{edge}}; --edge-hi: rgba(181,154,227,0.32); background: linear-gradient(160deg, #2E2345 0%, #231B35 60%, #1E172D 100%); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; flex-grow: 1; min-height: 0">
        <span class="glow" aria-hidden="true" style="left: -50px; top: -60px; width: 200px; height: 150px; background: radial-gradient(closest-side, {{glow}}, rgba(145,116,201,0))"></span>
        <div style="display: flex; align-items: baseline; justify-content: space-between; position: relative">
          <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #B59AE3">{{stateLabel}}</h2>
          <span style="font-size: 11px; font-weight: 500; color: rgba(180,168,204,0.75)">25 minute session</span>
        </div>
        <div style="display: flex; align-items: center; gap: 16px; margin-top: 8px; flex-grow: 1; position: relative">
          <div role="img" aria-label="{{ringLabel}}" style="width: 148px; height: 148px; position: relative; flex-shrink: 0">
            <svg width="148" height="148" viewBox="0 0 148 148" aria-hidden="true" style="position: absolute; inset: 0; transform: rotate(-90deg)">
              <circle cx="74" cy="74" r="66" fill="none" stroke="{{track}}" stroke-width="8"></circle>
              <circle cx="74" cy="74" r="66" fill="none" stroke="{{colour}}" stroke-width="8" stroke-linecap="round" stroke-dasharray="{{dash}}"></circle>
            </svg>
            <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
              <span class="num" style="font-size: 28px; font-weight: 600; letter-spacing: -0.01em">{{time}}</span>
              <span style="font-size: 11px; font-weight: 600; color: {{soft}}">{{name}}</span>
            </div>
          </div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0">
            <div role="group" aria-label="Subject" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
              <sc-for list="{{subjects}}" as="s" hint-placeholder-count="6">
                <button type="button" class="btn" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="height: 30px; border-radius: 8px; border: {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; padding: 0 8px; font-family: inherit; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap"><span style="width: 6px; height: 6px; border-radius: 2px; background: {{s.c}}; flex-shrink: 0"></span>{{s.short}}</button>
              </sc-for>
            </div>
            <div style="display: flex; gap: 6px">
              <button type="button" class="btn" onClick="{{toggle}}" style="flex-grow: 1; height: 34px; border-radius: 8px; border: {{btnBorder}}; background: {{btnBg}}; color: {{btnFg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{buttonLabel}}</button>
              <button type="button" class="btn" onClick="{{reset}}" aria-label="Reset" style="width: 34px; height: 34px; border-radius: 8px; border: 1px solid rgba(181,154,227,0.2); background: rgba(181,154,227,0.08); color: #D7C8F2; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg></button>
            </div>
          </div>
        </div>
      </section>
      <section class="card" aria-label="Sessions" style="--edge: rgba(255,255,255,0.08); --edge-hi: rgba(255,255,255,0.16); background: #17171A; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; height: 84px; flex-shrink: 0">
        <div style="display: flex; align-items: baseline; justify-content: space-between; position: relative">
          <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #F2F2F4">Sessions this week</h2><span class="num" style="font-size: 11px; font-weight: 500; color: #8E8E97">0 min</span>
        </div>
        <div style="flex-grow: 1; display: flex; align-items: center; gap: 10px; margin-top: 6px">
          <span style="width: 28px; height: 28px; border-radius: 8px; background: rgba(181,154,227,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B59AE3" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>
          <span style="font-size: 13px; color: #A9A9B1">No sessions yet. Start one above and it logs here.</span>
        </div>
      </section>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; min-height: 0">
      <section class="card" aria-label="Balance" style="--edge: rgba(255,255,255,0.08); --edge-hi: rgba(255,255,255,0.16); background: #17171A; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; flex-grow: 1; min-height: 0">
        <div style="display: flex; align-items: baseline; justify-content: space-between; position: relative">
          <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #F2F2F4">Balance this week</h2><span class="num" style="font-size: 11px; font-weight: 500; color: #8E8E97">minutes</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px">
          <sc-for list="{{subjects}}" as="s" hint-placeholder-count="6">
            <div style="display: grid; grid-template-columns: 70px minmax(0, 1fr) 26px; align-items: center; gap: 8px">
              <span style="font-size: 11px; font-weight: 600; color: {{s.soft}}">{{s.short}}</span>
              <span style="height: 6px; border-radius: 3px; background: {{s.trackBg}}"></span>
              <span class="num" style="font-size: 11px; font-weight: 600; color: #A9A9B1; text-align: right">0m</span>
            </div>
          </sc-for>
        </div>
        <div style="margin-top: auto; padding: 6px 8px; border-radius: 8px; background: rgba(181,154,227,0.10); font-size: 11px; font-weight: 500; color: #D7C8F2">Chemistry is furthest behind for its test</div>
      </section>
      <section class="card" aria-label="Next test" style="--edge: rgba(181,154,227,0.14); --edge-hi: rgba(181,154,227,0.32); background: linear-gradient(160deg, #31264A 0%, #251D37 60%, #201930 100%); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; flex-shrink: 0">
        <span class="glow" aria-hidden="true" style="right: -50px; top: -60px; width: 180px; height: 130px; background: radial-gradient(closest-side, rgba(181,154,227,0.15), rgba(181,154,227,0))"></span>
        <div style="display: flex; align-items: baseline; justify-content: space-between; position: relative">
          <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #B59AE3">Next test</h2><span class="num" style="font-size: 11px; font-weight: 500; color: rgba(180,168,204,0.75)">Mon 23 Nov</span>
        </div>
        <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; position: relative">
          <span style="font-size: 15px; font-weight: 600">Chemistry unit test</span>
          <span style="display: flex; align-items: baseline; gap: 4px"><span class="num" style="font-size: 22px; font-weight: 600; color: #CDB6F2">5</span><span style="font-size: 11px; color: rgba(180,168,204,0.75)">days</span></span>
        </div>
        <div class="num" style="font-size: 11px; font-weight: 500; color: rgba(180,168,204,0.75); position: relative">9:00 am</div>
      </section>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":684,"height":453}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'chem', running: false, left: 1500 }; this.timer = null; }
  componentWillUnmount() { if (this.timer) clearInterval(this.timer); }
  renderVals() {
    const all = [
      { id: 'hb', short: 'Human Bio', name: 'Human Biology', c: '#C47791', rgb: '196,119,145', soft: '#D99FB3' },
      { id: 'chem', short: 'Chemistry', name: 'Chemistry', c: '#9174C9', rgb: '145,116,201', soft: '#B59AE3' },
      { id: 'meth', short: 'Methods', name: 'Methods', c: '#588CC5', rgb: '88,140,197', soft: '#88B5E0' },
      { id: 'spec', short: 'Specialist', name: 'Specialist', c: '#5FA9B5', rgb: '95,169,181', soft: '#8FCAD3' },
      { id: 'eng', short: 'English', name: 'English', c: '#C0A76D', rgb: '192,167,109', soft: '#D8C28C' },
      { id: 'rel', short: 'Religion', name: 'Religion and Life', c: '#A88F72', rgb: '168,143,114', soft: '#C7B49C' }
    ];
    const cur = all.find((s) => s.id === this.state.picked) || all[1];
    const left = this.state.left, running = this.state.running, started = left < 1500;
    const circ = 414.7;
    const subjects = all.map((s) => {
      const on = s.id === cur.id;
      return {
        short: s.short, c: s.c, soft: s.soft,
        trackBg: 'rgba(' + s.rgb + ',0.18)',
        bg: on ? 'rgba(' + s.rgb + ',0.28)' : 'rgba(255,255,255,0.04)',
        border: on ? '1px solid rgba(' + s.rgb + ',0.7)' : '1px solid rgba(255,255,255,0.06)',
        fg: on ? '#F2F2F4' : '#A9A9B1',
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ picked: s.id })
      };
    });
    return {
      subjects,
      colour: cur.soft, soft: cur.soft, name: cur.name,
      track: 'rgba(' + cur.rgb + ',0.2)',
      dash: Math.max(0.01, (left / 1500) * circ) + ' ' + circ,
      time: String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'),
      ringLabel: Math.floor(left / 60) + ' minutes left, ' + cur.name,
      stateLabel: running ? 'Focusing' : (started ? 'Paused' : 'Focus session'),
      edge: running ? 'rgba(181,154,227,0.38)' : 'rgba(181,154,227,0.14)',
      glow: running ? 'rgba(145,116,201,0.28)' : 'rgba(145,116,201,0.15)',
      btnBg: running ? 'rgba(181,154,227,0.14)' : '#B59AE3',
      btnFg: running ? '#D7C8F2' : '#1B1528',
      btnBorder: running ? '1px solid rgba(181,154,227,0.5)' : '1px solid #B59AE3',
      buttonLabel: running ? 'Pause' : (started ? 'Resume' : 'Start'),
      toggle: () => {
        if (this.state.running) { clearInterval(this.timer); this.timer = null; this.setState({ running: false }); return; }
        this.timer = setInterval(() => {
          const n = Math.max(0, this.state.left - 1);
          this.setState({ left: n });
          if (n === 0) { clearInterval(this.timer); this.timer = null; this.setState({ running: false }); }
        }, 1000);
        this.setState({ running: true });
      },
      reset: () => { if (this.timer) { clearInterval(this.timer); this.timer = null; } this.setState({ running: false, left: 1500 }); }
    };
  }
}
</script>
</body>
</html>

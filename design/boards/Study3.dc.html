<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halo Study</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:transparent;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.nav a{transition:color .15s ease,background-color .15s ease}
.nav a:hover{background:rgba(255,255,255,0.08);color:#F2F2F4}
.nav a:focus-visible,.btn:focus-visible,.tile:focus-visible{outline:2px solid #D8C28C;outline-offset:2px}
.btn{transition:transform .12s ease,filter .15s ease,background-color .15s ease}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(0.96)}
.tile{transition:transform .14s ease,background .18s ease}
.tile:hover{filter:brightness(1.08)}
.tile:active{transform:scale(0.97)}
</style>
</helmet>
<div style="width: 600px; height: 290px; box-sizing: border-box; border-radius: 26px; border: 1px solid rgba(181,154,227,0.20); background: linear-gradient(165deg, #2B2240 0%, #1E1830 55%, #15111F 100%); color: #F5F5F7; font-family: 'Onest', system-ui, sans-serif; position: relative; overflow: hidden; padding: 10px 16px 12px; display: flex; flex-direction: column">
  <span aria-hidden="true" style="position: absolute; left: -90px; top: -110px; width: 340px; height: 230px; background: radial-gradient(closest-side, rgba(181,154,227,0.16), rgba(181,154,227,0)); pointer-events: none"></span>
  <header style="height: 32px; display: flex; align-items: center; justify-content: space-between; position: relative">
    <div style="display: flex; align-items: center; gap: 8px">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600">Study</h1>
      <span class="num" style="font-size: 13px; font-weight: 500; color: rgba(245,245,247,0.5)">Week of 16 Nov</span>
    </div>
    <nav class="nav" aria-label="Halo sections" style="display: flex; align-items: center; gap: 0">
      <a href="Home2.dc.html" aria-label="Home" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #F2F2F4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg></a>
      <a href="Music.dc.html" aria-label="Music" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #C9B6F0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="17.5" cy="16" r="2.5"></circle></svg></a>
      <a href="Study3.dc.html" aria-label="Study" aria-current="page" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.10); color: #F2F2F4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6c-2-1.5-5-2-8-1.5V19c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V4.5C17 4 14 4.5 12 6z"></path><path d="M12 6v14.5"></path></svg></a>
      <a href="Pay3.dc.html" aria-label="Pay" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #91BDA0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2.5"></rect><path d="M3 10h18"></path></svg></a>
      <a href="Sixers2.dc.html" aria-label="Sixers" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #88B5E0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3v18M5.6 5.6c3 3 3 9.8 0 12.8M18.4 5.6c-3 3-3 9.8 0 12.8"></path></svg></a>
      <a href="Week.dc.html" aria-label="Week" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #D5D5DC"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></a>
      <span aria-hidden="true" style="width: 1px; height: 14px; margin: 0 4px; background: rgba(255,255,255,0.14)"></span>
      <a href="More.dc.html" aria-label="More tabs" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #B9B9C2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></a>
      <a href="Controls.dc.html" aria-label="Controls" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #D99FB3"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></a>
    </nav>
  </header>
  <div style="flex-grow: 1; margin-top: 8px; min-height: 0; position: relative; display: flex; flex-direction: column; ">
    <div style="flex-grow: 1; display: flex; gap: 16px; min-height: 0">
      <section aria-label="Focus" style="flex: 1.2; display: flex; align-items: center; gap: 14px; min-width: 0">
        <div role="img" aria-label="{{ringLabel}}" style="width: 128px; height: 128px; position: relative; flex-shrink: 0">
          <svg width="128" height="128" viewBox="0 0 128 128" aria-hidden="true" style="position: absolute; inset: 0; transform: rotate(-90deg)"><circle cx="64" cy="64" r="57" fill="none" stroke="{{track}}" stroke-width="7"></circle><circle cx="64" cy="64" r="57" fill="none" stroke="{{colour}}" stroke-width="7" stroke-linecap="round" stroke-dasharray="{{dash}}"></circle></svg>
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center"><span class="num" style="font-size: 28px; font-weight: 600">{{time}}</span><span style="font-size: 11px; font-weight: 600; color: {{colour}}">{{name}}</span></div>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <div role="group" aria-label="Subject" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px">
            <sc-for list="{{subjects}}" as="s" hint-placeholder-count="6"><button type="button" class="btn" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="height: 26px; border-radius: 8px; border: {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; padding: 0 7px; font-family: inherit; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap"><span style="width: 6px; height: 6px; border-radius: 2px; background: {{s.c}}"></span>{{s.short}}</button></sc-for>
          </div>
          <button type="button" class="btn" onClick="{{toggle}}" style="height: 32px; border-radius: 8px; border: {{btnBorder}}; background: {{btnBg}}; color: {{btnFg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{buttonLabel}}</button>
        </div>
      </section>
      <span aria-hidden="true" style="width: 1px; align-self: stretch; background: rgba(255,255,255,0.09)"></span>
      <section aria-label="Balance this week" style="flex: 0.8; display: flex; flex-direction: column; min-width: 0">
        <div style="display: flex; align-items: baseline; justify-content: space-between"><h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #F2F2F4">This week</h2><span class="num" style="font-size: 11px; color: rgba(245,245,247,0.5)">0 min</span></div>
        <div style="margin-top: 6px; display: flex; flex-direction: column; gap: 7px">
          <sc-for list="{{subjects}}" as="s" hint-placeholder-count="6"><div style="display: grid; grid-template-columns: 64px minmax(0, 1fr) 20px; align-items: center; gap: 6px"><span style="font-size: 11px; font-weight: 600; color: {{s.soft}}">{{s.short}}</span><span style="height: 5px; border-radius: 3px; background: {{s.trackBg}}"></span><span class="num" style="font-size: 11px; color: rgba(245,245,247,0.5); text-align: right">0m</span></div></sc-for>
        </div>
        <div style="margin-top: auto; font-size: 11px; font-weight: 600; color: #D7C8F2">Chemistry is furthest behind</div>
      </section>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":290}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'chem', running: false, left: 1500 }; this.timer = null; }
  componentWillUnmount() { if (this.timer) clearInterval(this.timer); }
  renderVals() {
    const all = [
      { id: 'hb', short: 'Human Bio', name: 'Human Biology', c: '#C47791', rgb: '196,119,145', soft: '#D99FB3' },
      { id: 'chem', short: 'Chemistry', name: 'Chemistry', c: '#9174C9', rgb: '145,116,201', soft: '#B59AE3' },
      { id: 'meth', short: 'Methods', name: 'Methods', c: '#588CC5', rgb: '88,140,197', soft: '#88B5E0' },
      { id: 'spec', short: 'Specialist', name: 'Specialist', c: '#5FA9B5', rgb: '95,169,181', soft: '#8FCAD3' },
      { id: 'eng', short: 'English', name: 'English', c: '#C0A76D', rgb: '192,167,109', soft: '#D8C28C' },
      { id: 'rel', short: 'Religion', name: 'Religion and Life', c: '#A88F72', rgb: '168,143,114', soft: '#C7B49C' }
    ];
    const cur = all.find((s) => s.id === this.state.picked) || all[1];
    const left = this.state.left, running = this.state.running, started = left < 1500;
    const circ = 358.1;
    const subjects = all.map((s) => {
      const on = s.id === cur.id;
      return {
        short: s.short, c: s.c, soft: s.soft,
        trackBg: 'rgba(' + s.rgb + ',0.18)',
        bg: on ? 'rgba(' + s.rgb + ',0.28)' : 'rgba(255,255,255,0.04)',
        border: on ? '1px solid rgba(' + s.rgb + ',0.7)' : '1px solid rgba(255,255,255,0.06)',
        fg: on ? '#F2F2F4' : '#A9A9B1',
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ picked: s.id })
      };
    });
    return {
      subjects,
      colour: cur.soft, soft: cur.soft, name: cur.name,
      track: 'rgba(' + cur.rgb + ',0.2)',
      dash: Math.max(0.01, (left / 1500) * circ) + ' ' + circ,
      time: String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'),
      ringLabel: Math.floor(left / 60) + ' minutes left, ' + cur.name,
      stateLabel: running ? 'Focusing' : (started ? 'Paused' : 'Focus session'),
      edge: running ? 'rgba(181,154,227,0.38)' : 'rgba(181,154,227,0.14)',
      glow: running ? 'rgba(145,116,201,0.28)' : 'rgba(145,116,201,0.15)',
      btnBg: running ? 'rgba(181,154,227,0.14)' : '#B59AE3',
      btnFg: running ? '#D7C8F2' : '#1B1528',
      btnBorder: running ? '1px solid rgba(181,154,227,0.5)' : '1px solid #B59AE3',
      buttonLabel: running ? 'Pause' : (started ? 'Resume' : 'Start'),
      toggle: () => {
        if (this.state.running) { clearInterval(this.timer); this.timer = null; this.setState({ running: false }); return; }
        this.timer = setInterval(() => {
          const n = Math.max(0, this.state.left - 1);
          this.setState({ left: n });
          if (n === 0) { clearInterval(this.timer); this.timer = null; this.setState({ running: false }); }
        }, 1000);
        this.setState({ running: true });
      },
      reset: () => { if (this.timer) { clearInterval(this.timer); this.timer = null; } this.setState({ running: false, left: 1500 }); }
    };
  }
}
</script>
</body>
</html>

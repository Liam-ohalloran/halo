<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halo Week</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:transparent;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.nav a{transition:color .15s ease,background-color .15s ease}
.nav a:hover{background:rgba(255,255,255,0.08);color:#F2F2F4}
.nav a:focus-visible,.btn:focus-visible,.tile:focus-visible{outline:2px solid #D8C28C;outline-offset:2px}
.btn{transition:transform .12s ease,filter .15s ease,background-color .15s ease}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(0.96)}
.tile{transition:transform .14s ease,background .18s ease}
.tile:hover{filter:brightness(1.08)}
.tile:active{transform:scale(0.97)}
</style>
</helmet>
<div style="width: 600px; height: 290px; box-sizing: border-box; border-radius: 26px; border: 1px solid rgba(255,255,255,0.10); background: linear-gradient(165deg, #1C1B21 0%, #141418 55%, #0F0F12 100%); color: #F2F2F4; font-family: 'Onest', system-ui, sans-serif; position: relative; overflow: hidden; padding: 10px 18px 14px; display: flex; flex-direction: column">
  <span aria-hidden="true" style="position: absolute; left: -90px; top: -110px; width: 340px; height: 230px; background: radial-gradient(closest-side, rgba(216,194,140,0.10), rgba(216,194,140,0)); pointer-events: none"></span>
  <header style="height: 32px; display: flex; align-items: center; justify-content: space-between; position: relative">
    <div style="display: flex; align-items: center; gap: 8px">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600">Week</h1>
      <span class="num" style="font-size: 13px; font-weight: 500; color: rgba(245,245,247,0.5)">18 to 24 Nov</span>
    </div>
    <nav class="nav" aria-label="Halo sections" style="display: flex; align-items: center; gap: 0">
      <a href="Home2.dc.html" aria-label="Home" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #F2F2F4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg></a>
      <a href="Music.dc.html" aria-label="Music" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #C9B6F0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="17.5" cy="16" r="2.5"></circle></svg></a>
      <a href="Study3.dc.html" aria-label="Study" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #B59AE3"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6c-2-1.5-5-2-8-1.5V19c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V4.5C17 4 14 4.5 12 6z"></path><path d="M12 6v14.5"></path></svg></a>
      <a href="Pay3.dc.html" aria-label="Pay" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #91BDA0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2.5"></rect><path d="M3 10h18"></path></svg></a>
      <a href="Sixers2.dc.html" aria-label="Sixers" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #88B5E0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3v18M5.6 5.6c3 3 3 9.8 0 12.8M18.4 5.6c-3 3-3 9.8 0 12.8"></path></svg></a>
      <a href="Week.dc.html" aria-label="Week" aria-current="page" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.10); color: #F2F2F4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></a>
      <span aria-hidden="true" style="width: 1px; height: 14px; margin: 0 4px; background: rgba(255,255,255,0.14)"></span>
      <a href="More.dc.html" aria-label="More tabs" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #B9B9C2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></a>
      <a href="Controls.dc.html" aria-label="Controls" style="width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #D99FB3"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></a>
    </nav>
  </header>
  <div class="num" style="flex-grow: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 8px; min-height: 0; position: relative">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
      <button type="button" class="tile" onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" aria-label="{{d.label}}" style="border-radius: 14px; border: {{d.border}}; background: {{d.bg}}; color: #F2F2F4; font-family: inherit; padding: 8px 6px; display: flex; flex-direction: column; gap: 5px; text-align: left; cursor: pointer; min-width: 0">
        <span style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px">
          <span style="font-size: 11px; font-weight: 600; color: {{d.dayCol}}">{{d.dow}}</span>
          <span style="font-size: 15px; font-weight: 600; color: {{d.numCol}}">{{d.n}}</span>
        </span>
        <sc-for list="{{d.items}}" as="e" hint-placeholder-count="2">
          <span style="display: block; border-radius: 7px; padding: 4px 6px; background: {{e.bg}}; min-width: 0">
            <span style="display: block; font-size: 11px; font-weight: 600; color: {{e.col}}">{{e.time}}</span>
            <span style="display: block; font-size: 11px; font-weight: 500; color: #E6E6EA; line-height: 1.25">{{e.title}}</span>
          </span>
        </sc-for>
      </button>
    </sc-for>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px; position: relative">
    <span style="font-size: 13px; font-weight: 500; color: #D8D8DE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{selText}}</span>
    <span class="num" style="display: flex; gap: 6px; flex-shrink: 0">
      <span style="height: 20px; padding: 0 8px; border-radius: 6px; background: rgba(211,155,101,0.16); color: #E6B88A; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center">3 shifts, 13 h</span>
      <span style="height: 20px; padding: 0 8px; border-radius: 6px; background: rgba(181,154,227,0.16); color: #D7C8F2; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center">1 test</span>
      <span style="height: 20px; padding: 0 8px; border-radius: 6px; background: rgba(217,159,179,0.16); color: #EBC3D1; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center">3 tutoring</span>
    </span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":290}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 0 }; }
  renderVals() {
    const C = {
      shift: ['rgba(211,155,101,0.16)', '#E6B88A', 'shift'],
      test: ['rgba(181,154,227,0.18)', '#D7C8F2', 'test'],
      sport: ['rgba(136,181,224,0.16)', '#A9CBEC', 'sport'],
      tutor: ['rgba(217,159,179,0.16)', '#EBC3D1', 'tutoring'],
      win: ['rgba(216,194,140,0.16)', '#E8D9B0', 'milestone']
    };
    const raw = [
      { dow: 'Wed', n: '18', items: [['win', 'All day', 'Exams done']] },
      { dow: 'Thu', n: '19', items: [['sport', '8:00 am', 'Sixers'], ['shift', '4:00 pm', 'PI shift'], ['tutor', '6:00 pm', 'Laura']] },
      { dow: 'Fri', n: '20', items: [] },
      { dow: 'Sat', n: '21', items: [['shift', '5:30 pm', 'PA shift']] },
      { dow: 'Sun', n: '22', items: [['shift', '10:00 am', 'GC shift']] },
      { dow: 'Mon', n: '23', items: [['test', '9:00 am', 'Chem test']] },
      { dow: 'Tue', n: '24', items: [['tutor', '4:45 pm', 'Leo'], ['sport', '6:50 pm', 'Netball']] }
    ];
    const sel = this.state.sel;
    const days = raw.map((d, i) => {
      const on = i === sel, today = i === 0;
      return {
        dow: d.dow, n: d.n,
        label: d.dow + ' ' + d.n + ', ' + (d.items.length ? d.items.map((e) => e[2] + (e[0] === 'tutor' ? ' tutoring' : '') + ' ' + e[1]).join(', ') : 'nothing on'),
        pressed: on ? 'true' : 'false',
        bg: on ? 'rgba(255,255,255,0.09)' : 'rgba(255,255,255,0.035)',
        border: on ? '1px solid rgba(255,255,255,0.22)' : (today ? '1px solid rgba(216,194,140,0.45)' : '1px solid rgba(255,255,255,0.05)'),
        dayCol: today ? '#D8C28C' : 'rgba(235,235,245,0.55)',
        numCol: today ? '#E8D9B0' : '#F2F2F4',
        items: d.items.map((e) => ({ bg: C[e[0]][0], col: C[e[0]][1], time: e[1], title: e[2] })),
        pick: () => this.setState({ sel: i })
      };
    });
    const s = raw[sel];
    const selText = (sel === 0 ? 'Today' : s.dow + ' ' + s.n) + ': ' + (s.items.length ? s.items.map((e) => e[2] + (e[0] === 'tutor' ? ' tutoring' : '') + (e[1] === 'All day' ? '' : ' ' + e[1])).join(', ') : 'nothing on, a free day');
    return { days, selText };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halo · All tabs · Colour</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&family=Doto:wght@900&display=swap" rel="stylesheet">
<style>
  :root{--amber:#FF8A1E;--gold:#FFC23D;--green:#5CFF7A;--cobalt:#3D5AFE;--blue:#3D9BFF;--mag:#FF2FA3;--purple:#BF5AF2;--red:#FF453A;--pearl:#F5F7FF;--fog:#AEB6C2;--slow:1;--glow:rgba(92,255,122,.45);
    --open:calc(540ms*var(--slow));--close:calc(380ms*var(--slow));--spring:cubic-bezier(.34,1.5,.5,1);--ease:cubic-bezier(.4,0,.2,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Inter Tight",system-ui,sans-serif;color:var(--pearl);overflow:hidden;min-height:560px;-webkit-font-smoothing:antialiased;user-select:none;
    background:radial-gradient(700px 420px at 20% 100%,var(--bg1,#0e4a24),transparent 60%),radial-gradient(800px 460px at 85% 95%,var(--bg2,#152a6b),transparent 60%),#0c0b10;transition:background .8s}
  .caps{font-family:"Geist Mono",monospace;font-size:8px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
  .num{font-variant-numeric:tabular-nums}
  .dot{font-family:"Doto",monospace;font-weight:900}
  .stage{position:absolute;inset:0}
  .island{position:absolute;top:0;left:50%;transform:translateX(-50%);width:200px;height:34px;background:#000;border-radius:0 0 17px 17px;cursor:pointer;
    transition:width var(--close) var(--ease),height var(--close) var(--ease),border-radius var(--close) var(--ease),box-shadow .6s}
  .island.open{width:600px;height:290px;border-radius:0 0 42px 42px;cursor:default;
    transition:width var(--open) var(--spring),height var(--open) var(--spring),border-radius var(--open) var(--spring),box-shadow .6s;
    box-shadow:0 30px 70px -30px var(--glow),0 20px 50px -20px rgba(0,0,0,.95)}
  .ear{position:absolute;top:0;width:16px;height:16px}
  .ear.l{left:-16px;background:radial-gradient(circle at 0 100%,transparent 15.5px,#000 16px)}
  .ear.r{right:-16px;background:radial-gradient(circle at 100% 100%,transparent 15.5px,#000 16px)}
  .clip{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
  .compact{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 10px;transition:opacity calc(160ms*var(--slow)) var(--ease) calc(220ms*var(--slow))}
  .open .compact{opacity:0;transition-delay:0s;pointer-events:none}
  .compact .v{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
  .compact svg.cic{width:18px;height:18px}

  .content{position:absolute;left:0;top:0;width:600px;height:290px;padding:10px 18px 14px;pointer-events:none;opacity:0;transition:opacity calc(150ms*var(--slow))}
  .open .content{pointer-events:auto;opacity:1;transition:opacity calc(250ms*var(--slow)) calc(220ms*var(--slow))}
  .top{display:flex;justify-content:space-between;align-items:center;height:28px}
  .seg{position:relative;display:flex;gap:1px;padding:3px;border-radius:999px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  .seg .sel{position:absolute;top:3px;bottom:3px;border-radius:999px;background:var(--pearl);transition:left calc(420ms*var(--slow)) var(--spring),width calc(420ms*var(--slow)) var(--spring)}
  .seg a,.seg button{position:relative;z-index:1;height:22px;min-width:22px;padding:0 5px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:999px;color:rgba(245,247,255,.5);border:0;background:none;cursor:pointer;font:inherit;font-size:11px;font-weight:700;text-decoration:none;white-space:nowrap;transition:color .25s}
  .seg a:hover,.seg button:hover{color:#fff}
  .seg svg{width:12px;height:12px;flex:none}
  .seg .on,.seg .on:hover{color:#000;padding:0 9px}
  .seg .lb{display:none}.seg .on .lb{display:inline}
  .seg a{opacity:.55}
  .rt{font-size:12px;font-weight:600}.rt span{color:var(--fog);font-weight:500}

  .views{position:relative;height:226px;margin-top:8px}
  .view{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity calc(160ms*var(--slow))}
  .view.on{opacity:1;pointer-events:auto}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,70px);gap:8px;height:100%}

  /* ---- Home's tile ---- */
  .t{position:relative;border-radius:20px;padding:9px 12px;overflow:hidden;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.05);
    opacity:0;transform:scale(.9) translateY(-8px);transition:opacity calc(110ms*var(--slow)),transform calc(110ms*var(--slow))}
  .view.on .t{opacity:1;transform:none;transition:opacity calc(260ms*var(--slow)) var(--ease),transform calc(520ms*var(--slow)) var(--spring);transition-delay:calc((60ms + var(--i,0)*40ms)*var(--slow))}
  .view.on .t:hover{transform:scale(1.025);transition-delay:0s}
  .view.on .t:active{transform:scale(.97)}
  .t.s2{grid-column:span 2}.t.s3{grid-column:span 3}.t.s4{grid-column:span 4}.t.r2{grid-row:span 2}
  .t .caps{display:block}
  .big{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1;margin-top:5px;white-space:nowrap}
  .big small{font-size:12px;font-weight:600;opacity:.6;letter-spacing:0}
  .sub{font-size:10px;margin-top:3px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vis{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
  .tr{position:absolute;right:10px;top:9px}
  .chip{font-family:"Geist Mono",monospace;font-size:8.5px;font-weight:700;padding:1px 6px;border-radius:999px}
  .gone{opacity:0!important;transform:scale(.6)!important;transition:all .35s var(--ease)!important}

  /* colour themes, same recipe as Home */
  .amber{background:radial-gradient(200px 110px at 15% 120%,rgba(255,170,40,.5),transparent 70%),linear-gradient(160deg,#2b1700,#110800 70%)} .amber .caps{color:var(--gold)}
  .green{background:radial-gradient(140px 90px at 90% 120%,rgba(92,255,122,.3),transparent 70%),linear-gradient(150deg,#04210f,#06130a)} .green .caps{color:var(--green)}
  .blue{background:radial-gradient(150px 90px at 100% 0,rgba(150,190,255,.45),transparent 70%),linear-gradient(170deg,#24407a,#0f1a38)} .blue .caps{color:#b9cdff}
  .cobalt{background:radial-gradient(160px 100px at 100% 0,rgba(110,140,255,.45),transparent 70%),linear-gradient(160deg,#101d6e,#070c33)} .cobalt .caps{color:#9fb0ff}
  .mag{background:radial-gradient(200px 80px at 0% 130%,rgba(255,47,163,.6),transparent 70%),linear-gradient(90deg,#1a0612,#0b0b0e 70%)} .mag .caps{color:#ffb3df}
  .purple{background:radial-gradient(130px 90px at 100% 0,rgba(230,170,255,.45),transparent 70%),linear-gradient(160deg,#5a1f86,#24093a)} .purple .caps{color:#e2b8ff}
  .red{background:radial-gradient(120px 80px at 100% 120%,rgba(237,23,76,.5),transparent 70%),linear-gradient(160deg,#4a0a1c,#1a0309)} .red .caps{color:#ff9fb3}
  .gold{background:radial-gradient(150px 100px at 85% 120%,rgba(255,194,61,.45),transparent 70%),linear-gradient(160deg,#2b1d00,#110b00)} .gold .caps{color:var(--gold)}
  .night{background:radial-gradient(200px 140px at 85% 0,rgba(160,140,255,.4),transparent 70%),linear-gradient(170deg,#1a1450,#06051a)} .night .caps{color:#c3b8ff}
  .teal{background:radial-gradient(150px 90px at 100% 120%,rgba(61,214,255,.35),transparent 70%),linear-gradient(160deg,#06323d,#031418)} .teal .caps{color:#9ee8ff}
  .dark{background:linear-gradient(160deg,#17171d,#0e0e12)} .dark .caps{color:var(--fog)}
  .ink{background:#07070b} .ink .caps{color:var(--fog)}

  .cur{display:inline-block;width:7px;height:13px;background:#ff8fd0;vertical-align:-2px;margin-left:2px;animation:bl .8s steps(2) infinite}
  @keyframes bl{50%{opacity:0}}
  .ask{position:absolute;left:12px;right:12px;bottom:10px;display:flex;align-items:center;gap:6px;height:32px;padding:0 4px 0 12px;border-radius:999px;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
  .ask:focus-within{box-shadow:inset 0 0 0 1.5px rgba(255,120,200,.8)}
  .ask input{flex:1;background:none;border:0;outline:0;color:var(--pearl);font:inherit;font-size:12px}
  .ask input::placeholder{color:rgba(245,247,255,.45)}
  .ask button{width:26px;height:26px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:linear-gradient(160deg,#ff8fd0,#b04cff);color:#fff}
  .ask button svg{width:12px;height:12px}
  .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
  @keyframes tw{50%{opacity:.15}}
  .play{width:34px;height:34px;border-radius:50%;border:0;background:#fff;color:#000;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 18px -2px rgba(255,255,255,.5)}
  .play svg{width:13px;height:13px}
  .nightSky .lo{white-space:nowrap}
  /* ================= shared ================= */
  .gl{position:absolute;inset:0;pointer-events:none}
  .chipb{font-family:"Geist Mono",monospace;font-size:8.5px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
  .toggle{display:flex;gap:2px;padding:2px;border-radius:999px;background:rgba(255,255,255,.08)}
  .toggle button{border:0;background:none;font-family:"Geist Mono",monospace;font-size:8.5px;font-weight:700;color:var(--fog);padding:3px 9px;border-radius:999px;cursor:pointer}
  .toggle button.on{background:var(--pearl);color:#000}
  .pop{opacity:0;transform:scale(.92) translateY(-8px)}
  .view.on .pop{opacity:1;transform:none;transition:opacity calc(260ms*var(--slow)) var(--ease),transform calc(520ms*var(--slow)) var(--spring);transition-delay:calc((60ms + var(--i,0)*45ms)*var(--slow))}

  /* ================= PAY · charging + stock island ================= */
  .payHero{position:relative;height:148px;border-radius:26px;padding:12px 16px;overflow:hidden;background:#000;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 1px 0 rgba(255,255,255,.12)}
  .payHero::before{content:"";position:absolute;right:-40px;bottom:-60px;width:360px;height:180px;background:radial-gradient(closest-side,rgba(92,255,122,.28),transparent);pointer-events:none}
  .payTop{display:flex;justify-content:space-between;align-items:center}
  .payTop .caps{color:var(--green)}
  .payAmt{display:flex;align-items:baseline;gap:8px;margin-top:4px}
  .payAmt b{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .payAmt b small{font-size:18px;opacity:.55}
  .payAmt .chipb{color:#002b0c;background:var(--green)}
  .charge{position:relative;width:230px;height:22px;margin-top:12px}
  .charge .tr{position:absolute;left:0;right:0;top:8px;height:6px;border-radius:6px;background:rgba(255,255,255,.1)}
  .charge .fl{position:absolute;left:0;top:8px;height:6px;border-radius:6px;width:0;background:linear-gradient(90deg,#1f9d4c,var(--green));transition:width calc(900ms*var(--slow)) var(--spring)}
  .charge .ot{position:absolute;top:8px;height:6px;border-radius:0 6px 6px 0;width:0;background:repeating-linear-gradient(45deg,#ff8a1e 0 4px,#ffb066 4px 8px);transition:width calc(900ms*var(--slow)) var(--spring) calc(200ms*var(--slow))}
  .charge .mk{position:absolute;top:4px;width:2px;height:14px;border-radius:2px;background:#fff;opacity:.7}
  .charge .kn{position:absolute;top:0;transform:translateX(-50%);height:22px;padding:0 8px;border-radius:999px;display:flex;align-items:center;gap:3px;font-size:10.5px;font-weight:800;color:#06210f;
    background:linear-gradient(180deg,#9dffb0,var(--green));box-shadow:0 0 16px 2px rgba(92,255,122,.7),0 0 36px 6px rgba(92,255,122,.25);transition:left calc(900ms*var(--slow)) var(--spring)}
  .charge .kn svg{width:10px;height:10px}
  .chargeL{display:flex;justify-content:space-between;width:230px;font-family:"Geist Mono",monospace;font-size:7.5px;color:var(--fog);margin-top:3px}
  .area{position:absolute;right:12px;top:30px;width:290px;height:106px}
  .area svg{width:100%;height:84px;overflow:visible}
  .area .dl{display:flex;justify-content:space-between;font-family:"Geist Mono",monospace;font-size:7.5px;color:var(--fog);padding:4px 2px 0}
  .area .dl b{color:var(--pearl)}
  .pills4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
  .sp{height:70px;border-radius:35px;background:#000;display:flex;align-items:center;gap:9px;padding:0 14px 0 10px;cursor:pointer;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 1px 0 rgba(255,255,255,.1);transition:transform .4s var(--spring)}
  .sp:hover{transform:scale(1.03)}
  .sp .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
  .sp .ic svg{width:18px;height:18px}
  .sp small{display:block;font-family:"Geist Mono",monospace;font-size:7.5px;letter-spacing:.12em;color:var(--fog)}
  .sp b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:2px}

  /* ================= WEEK · watch complications ================= */
  .wkCols{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:154px}
  .wc{position:relative;border-radius:16px;padding:8px 4px 6px;background:#1c1c1e;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;cursor:pointer;
    transition:transform .4s var(--spring),box-shadow .3s,background .3s}
  .wc:hover{transform:translateY(-2px)}
  .wc.on{background:#2c2c2e;box-shadow:inset 0 0 0 1.5px #0A84FF,0 8px 20px -10px rgba(10,132,255,.7)}
  .wc small{font-size:8.5px;font-weight:600;color:#9a9aa2}
  .wc b{font-size:16px;font-weight:800;line-height:1.1}
  .wc .rings{margin:3px 0 3px}
  .wc .ev{display:flex;flex-direction:column;gap:3px;width:100%;padding:0 3px}
  .wc .ev span{display:flex;align-items:center;gap:4px;font-size:8px;font-weight:700;white-space:nowrap;overflow:hidden;color:rgba(245,247,255,.85)}
  .wc .ev span i{width:5px;height:5px;border-radius:50%;flex:none}
  .wc.today::after{content:"TMRW";position:absolute;top:-1px;left:50%;transform:translate(-50%,-50%);font-family:"Geist Mono",monospace;font-size:6.5px;font-weight:700;padding:1px 5px;border-radius:999px;background:#0A84FF;color:#fff;letter-spacing:.1em}
  .tl{position:relative;height:64px;margin-top:6px;border-radius:16px;background:#1c1c1e;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);padding:8px 14px}
  .tl .blkL{position:absolute;font-size:7.5px;font-weight:800;line-height:12px;white-space:nowrap}
  .tl .hd2{display:flex;justify-content:space-between;align-items:center}
  .tl .hd2 .caps{color:#9a9aa2}
  .tl .rule{position:relative;height:26px;margin-top:4px}
  .tl .rule .tk{position:absolute;bottom:0;width:1px;background:rgba(255,255,255,.18)}
  .tl .rule .tk em{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);font-style:normal;font-family:"Geist Mono",monospace;font-size:6.5px;color:rgba(174,182,194,.6)}
  .tl .blk{position:absolute;top:0;height:12px;border-radius:5px;font-size:7.5px;font-weight:800;padding:1px 5px;line-height:10px;white-space:nowrap;overflow:hidden;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3);transform-origin:left;animation:grow .6s var(--spring) both}
  @keyframes grow{from{transform:scaleX(0)}}

  /* ================= STUDY · lung app ================= */
  .stG{display:grid;grid-template-columns:250px 1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;height:100%}
  .puff{position:relative;border-radius:30px;overflow:hidden;padding:11px 14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 18px 30px -18px rgba(255,255,255,.35),inset 0 -30px 40px -20px rgba(0,0,0,.6)}
  .puff .dg{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.2px);background-size:9px 9px;pointer-events:none}
  .puff .caps{position:relative;color:rgba(255,255,255,.75)}
  .pTimer{grid-row:span 2;background:radial-gradient(160px 140px at 50% 45%,#2a1a6e,transparent 75%),linear-gradient(170deg,#3a2bb0,#160c45 60%,#0a0620)}
  .dring{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:150px;height:150px}
  .dtime{position:absolute;left:0;right:0;top:52%;transform:translateY(-50%);text-align:center}
  .dtime .dot{font-size:34px;letter-spacing:.02em;line-height:1;display:inline-flex;align-items:center}
  .dtime .colon{display:inline-flex;flex-direction:column;gap:7px;margin:0 3px}
  .dtime .colon i{width:5px;height:5px;border-radius:50%;background:#fff}
  .dtime small{display:block;font-family:"Geist Mono",monospace;font-size:8px;letter-spacing:.14em;color:rgba(255,255,255,.65);margin-top:5px}
  .pctl{position:absolute;left:12px;right:12px;bottom:10px;display:flex;align-items:center;gap:6px}
  .pctl .toggle{flex:1;justify-content:space-between;background:rgba(0,0,0,.35)}
  .pctl .play{width:32px;height:32px;border-radius:50%;border:0;background:#fff;color:#000;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 18px -2px rgba(255,255,255,.6)}
  .pctl .play svg{width:12px;height:12px}
  .pToday{background:radial-gradient(140px 90px at 80% 120%,#ff6a3d,transparent 70%),linear-gradient(170deg,#4a1220,#1a0610)}
  .pStreak{background:radial-gradient(140px 90px at 20% 120%,#3dd6ff,transparent 70%),linear-gradient(170deg,#0c2a3a,#06121a)}
  .pSubj{grid-column:span 2;background:linear-gradient(170deg,#141020,#09070f)}
  .puff .dv{position:relative;font-size:24px;margin-top:6px;line-height:1}
  .puff .dv small{font-family:"Inter Tight";font-size:10px;font-weight:600;opacity:.7;margin-left:4px}
  .arcs{position:absolute;right:10px;bottom:8px;width:90px;height:36px}
  .sdots{position:relative;display:flex;gap:4px;margin-top:8px}
  .sdots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-style:normal;font-family:"Geist Mono",monospace;font-size:7px;color:rgba(255,255,255,.5)}
  .sdots i.on{background:#9ee8ff;color:#06222c;box-shadow:0 0 10px #3dd6ff}
  .subrows{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:2px 10px;margin-top:5px}
  .sr{display:flex;align-items:center;gap:6px;cursor:pointer;border-radius:8px;padding:2px 4px;transition:background .2s}
  .sr:hover,.sr.on{background:rgba(255,255,255,.07)}
  .sr span{font-size:9.5px;font-weight:700;width:46px}
  .sr .dts{display:flex;gap:2px}
  .sr .dts i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.12)}

  /* ================= ALERTS · island pills + shaped glow ================= */
  .take{position:relative;height:78px;border-radius:26px;background:#000;overflow:hidden;display:flex;align-items:center;padding:0 16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
  .take svg.sh{position:absolute;left:0;top:0;width:100%;height:100%}
  .take .tx{position:relative;margin-left:auto;text-align:right}
  .take .tx small{display:block;font-family:"Geist Mono",monospace;font-size:8px;letter-spacing:.14em;color:var(--gold)}
  .take .tx b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
  .take .tx span{font-size:10px;color:rgba(255,255,255,.7)}
  .take .lf{position:relative;display:flex;flex-direction:column;gap:6px}
  .ap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .ip{height:40px;border-radius:20px;background:#000;display:flex;align-items:center;gap:9px;padding:0 12px 0 5px;cursor:pointer;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 8px 20px -12px var(--c);transition:transform .45s var(--spring),opacity .3s,width .4s}
  .ip:hover{transform:scale(1.03)}
  .ip .ai{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
  .ip .ai svg{width:14px;height:14px}
  .ip .t2{min-width:0;flex:1}
  .ip .t2 b{display:block;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ip .t2 span{display:block;font-size:8.5px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ip .w{font-family:"Geist Mono",monospace;font-size:8px;color:var(--c);font-weight:700}
  .ip.gone{transform:scale(.2);opacity:0}
  .ip.dim{opacity:.18}

  /* ================= CLAUDE · Lumiere orb ================= */
  .clG{display:grid;grid-template-columns:200px 1fr;gap:8px;height:100%}
  .orbStage{position:relative;border-radius:26px;background:radial-gradient(circle at 50% 42%,#140b22,#050508 70%);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);cursor:pointer}
  .lum{position:absolute;left:50%;top:42%;width:118px;height:118px;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;

    const btn = bnrEl.querySelector('button'); if (btn) btn.onclick = e => { e.stopPropagation(); toast(a === 'Snooze' ? 'Snoozed 5 min' : 'Demo: opens ' + a.replace('Open ', '')); }; }
  function endBanner(k) { isl.classList.remove('bnrOn'); bnrOn = false; NS.unshift(k); NS = NS.slice(0, 6); renderStack(); renderLive(); setTimeout(nextBanner, 600*slow()); }
  function placeStack() { const k = PRI.find(x => LV[x]); const h = isl.classList.contains('hudOn') ? 44 : k ? SZ[k][1] : 34; nst.style.top = (h + (k === 'charge' ? 52 : 10)) + 'px'; chgEl.style.top = (h + 8) + 'px'; }
  function renderStack() {
    nst.classList.toggle('on', NS.length > 0); nst.classList.toggle('fan', nOpen); nst.style.setProperty('--n', NS.length);
    nst.innerHTML = NS.map((k, i) => { const [c, ic, t, b] = NT[k]; return `<div class="np" data-i="${i}" style="--k:${c};--d:${i}"><span class="npI">${ic}</span><div class="npT"><b>${t}</b><span>${b}</span></div><small>${i ? (i*4) + 'm' : 'now'}</small><button class="npX" data-x="${i}">×</button></div>`; }).join('') + (NS.length > 1 ? `<div class="npMore">${nOpen ? 'Show less' : NS.length + ' notifications'}</div>` : '');
    placeStack(); }
  nst.addEventListener('mouseenter', () => { nOpen = true; nst.classList.add('fan'); const m = nst.querySelector('.npMore'); if (m) m.textContent = 'Show less'; });
  nst.addEventListener('mouseleave', () => { nOpen = false; nst.classList.remove('fan'); const m = nst.querySelector('.npMore'); if (m) m.textContent = NS.length + ' notifications'; });
  nst.addEventListener('click', e => { e.stopPropagation(); const x = e.target.closest('[data-x]'); if (x) { NS.splice(+x.dataset.x, 1); renderStack(); renderLive(); return; }
    if (e.target.closest('.npMore')) { nOpen = !nOpen; renderStack(); return; } if (e.target.closest('.np')) { NS = []; renderStack(); renderLive(); nOpen = false; open(); show('alerts'); } });
  // demo bar
  const LVN = {leave:'Leave now', game:'Live game', timer:'Study timer', shift:'Shift soon', music:'Music', charge:'Charging'};
  function syncLiveBar() { $('liveBar').querySelectorAll('[data-l]').forEach(b => b.classList.toggle('on', !!LV[b.dataset.l])); }
  $('liveBar').innerHTML = '<span>LIVE →</span>' + PRI.map(k => `<button data-l="${k}">${LVN[k]}</button>`).join('') + '<span style="margin-left:10px">NOTIFY →</span>' + Object.keys(NT).map(k => `<button data-n="${k}">${NTL[k]}</button>`).join('');
  $('liveBar').onclick = e => { const b = e.target.closest('button'); if (!b) return; e.stopPropagation();
    if (b.dataset.l) { const k = b.dataset.l; LV[k] = LV[k] ? 0 : 1; if (isl.classList.contains('open')) close();
      if (k === 'charge' && LV.charge) { const f = () => $('chgF'); setTimeout(() => { if (f()) f().style.width = '74%'; }, 300*slow()); setTimeout(() => { LV.charge = 0; if (f()) f().style.width = '0'; renderLive(); syncLiveBar(); }, 3200*slow()); }
      if (k === 'timer' && LV.timer) tRun = true; renderLive(); syncLiveBar(); }
    if (b.dataset.n) notify(b.dataset.n); };
  const sb = $('slow'); sb.onclick = () => document.documentElement.style.setProperty('--slow', sb.classList.toggle('on') ? 4 : 1);
  setInterval(() => { clock(); const n = $('nLeft'); if (n) n.textContent = loLeft(); }, 15000);
  const h = location.hash.slice(1); if (LOCAL.includes(h)) cur = h;
  clock(); show2compact(); setTimeout(open, 700);
})();
</script>
